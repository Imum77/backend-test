services:
  backend:
    build:
      context: ./backend
      args:
        - HTTP_PROXY=http://10.84.142.62:3128
        - HTTPS_PROXY=http://10.84.142.62:3128
        - http_proxy=http://10.84.142.62:3128
        - https_proxy=http://10.84.142.62:3128
    container_name: ${CONTAINER_NAME:-fastapi_backend}
    ports:
      - "${HOST_PORT:-8011}:8011" # Наружный порт меняется, внутренний в контейнере всегда 8011
    volumes:
      - ./backend:/app