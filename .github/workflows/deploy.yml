name: FastAPI Deploy Pipeline

on:
  push:
    branches: ["main"] # Срабатывает только при отправке кода в главную ветку

jobs:
  # --- ЭТАП 1: ПРОВЕРКА КОДА И СБОРКА DOCKER ---
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      - name: Check Python Syntax
        run: |
          python -m compileall backend/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      # Тестируем сборку Dockerfile локально в GitHub (без отправки куда-либо и без прокси)
      - name: Test Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false 

  # --- ЭТАП 2: ДЕПЛОЙ НА ЛОКАЛЬНЫЙ СЕРВЕР ---
  deploy-to-server:
    needs: build-and-test
    runs-on: self-hosted # Запускается прямо на твоем сервере sr-dus-netdata

    steps: 
      # Шаг 1: Скачиваем свежий код из коммита прямо в рабочую папку раннера на сервере
      - name: Checkout repository
        uses: actions/checkout@v5

      # Шаг 2: Локально собираем и поднимаем контейнеры в Docker
      - name: Deploy Docker Containers
        run: |
          docker compose up -d --build
          docker ps