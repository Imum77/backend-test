name: Second Workflow
on: push

jobs:
    run-first-command:
        runs-on: ubuntu-latest
        steps:
            - name: Display Python and Pip versions on Ubuntu
              run: |
                python --version
                pip --version
    run-parallel-command:
        runs-on: ubuntu-latest
        steps:
            - name: Display Python and Pip versions on Ubuntu
              run: |
                python --version 
                pip --version 
    run-second-command:
        runs-on: ubuntu latest
        needs: run-first-command
        steps:
            - name: Display Python and Pip versions on Ubuntu latest
              run: 
                python --version
                pip --version