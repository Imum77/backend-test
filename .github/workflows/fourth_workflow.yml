name: Fourth Workflow
on: 
  workflow_run:
    workflows: ["Third Workflow"]
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    success-command:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        steps: 
            - run: echo "Success"
    faiture-command:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        steps: 
            - run: echo "Failure"
              